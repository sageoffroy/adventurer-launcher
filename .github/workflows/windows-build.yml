name: Windows build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/AdventurerLauncher/AdventurerLauncher.csproj

      - name: Build
        run: dotnet build src/AdventurerLauncher/AdventurerLauncher.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows build
        run: dotnet publish src/AdventurerLauncher/AdventurerLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output publish

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: AventurerosLauncher-win-x64
          path: publish/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "No se encontró ISCC.exe de Inno Setup."
          }
          & $iscc "installer\AventurerosLauncher.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AventurerosLauncherSetup
          path: installer/output/AventurerosLauncherSetup.exe
